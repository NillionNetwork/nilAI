[project]
name = "nilai-e2e-tests"
version = "0.1.0"
description = "E2E test runner for NilAI Rust API"
requires-python = ">=3.12"
dependencies = [
    "nilai-py",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=1.2.0",
    "httpx>=0.28.1",
    "openai>=1.108.1",
    "requests>=2.32.0",
    "secp256k1>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tests"]

[tool.uv.workspace]
members = ["clients/nilai-py"]

[tool.uv.sources]
nilai-py = { workspace = true }
